<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 52" width="280" height="52">
  <!-- FCIS SVG Logo (content centered within the SVG) -->
  <g transform="translate(36, 4)">
    <!-- Red hexagon background -->
    <polygon points="0,22 25,0 75,0 100,22 75,44 25,44" fill="#DB0011"/>
    <!-- Two white triangles on the left/right sides of the inner square -->
    <polygon points="25,0 25,44 50,22" fill="#ffffff"/>
    <polygon points="75,0 75,44 50,22" fill="#ffffff"/>
    <!-- FCIS text (black, vertically centered) -->
    <text x="120" y="39" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#1a1a1a">FCIS</text>
  </g>
</svg>